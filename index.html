<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>홍장군 전용 산책 케어</title>
    <style>
        :root {
            --accent: #4A90E2;
            --coral: #FF6B6B;
            --bg: #F8F9FD;
            --white: #FFFFFF;
            --text: #333333;
            --text-sub: #888888;
            --text-muted: #aaaaaa;
            --card-bg: #F0F5FB;
            --card-border: #E1EAF4;
            --btn-bg: #F5F7FA;
            --btn-border: #E1E8F0;
            --btn-color: #666666;
            --step-bg: #ffffff;
            --step-border: #EFEFEF;
            --shadow-map: 0 2px 8px rgba(0,0,0,0.15);
            --shadow-ctrl: 0 -8px 28px rgba(0,0,0,0.09);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --accent: #5BA3F5;
                --coral: #FF7F7F;
                --bg: #0F1117;
                --white: #1C1E26;
                --text: #E8EAF0;
                --text-sub: #9098A8;
                --text-muted: #606878;
                --card-bg: #252830;
                --card-border: #2E3240;
                --btn-bg: #252830;
                --btn-border: #2E3240;
                --btn-color: #9098A8;
                --step-bg: #1C1E26;
                --step-border: #2E3240;
                --shadow-map: 0 2px 8px rgba(0,0,0,0.5);
                --shadow-ctrl: 0 -8px 28px rgba(0,0,0,0.4);
            }
        }
        * { box-sizing: border-box; }
        html, body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
            margin: 0;
            background: var(--bg);
            color: var(--text);
            height: 100%;
            overflow-x: hidden;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }
        body {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            min-height: -webkit-fill-available;
        }
        header {
            background: var(--white);
            padding: env(safe-area-inset-top, 12px) 20px 13px;
            text-align: center;
            box-shadow: 0 2px 12px rgba(0,0,0,0.06);
            z-index: 100;
            flex-shrink: 0;
            position: sticky;
            top: 0;
        }
        header h1 { margin: 0; font-size: 1.25rem; color: var(--accent); font-weight: 900; letter-spacing: -0.5px; }
        header p  { margin: 3px 0 0; font-size: 0.73rem; color: var(--text-sub); }

        /* 지도 컨테이너 */
        .map-wrap {
            position: relative;
            width: 100%;
            height: 45vw;
            min-height: 200px;
            max-height: 320px;
            flex-shrink: 0;
        }
        #map { width: 100%; height: 100%; }

        /* 지도 전체보기 버튼 */
        #map-expand-btn {
            position: absolute;
            top: 10px; right: 10px;
            z-index: 120;
            background: var(--white);
            border: 1px solid var(--card-border);
            border-radius: 10px;
            padding: 7px 10px;
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--text);
            box-shadow: var(--shadow-map);
            cursor: pointer;
            display: flex; align-items: center; gap: 4px;
            -webkit-tap-highlight-color: transparent;
        }
        #map-expand-btn:active { filter: brightness(0.9); }

        /* 지도 전체보기 모달 */
        #map-modal {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 999;
            background: #000;
            flex-direction: column;
        }
        #map-modal.show { display: flex; }
        #map-modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: env(safe-area-inset-top, 12px) 16px 10px;
            background: var(--white);
            border-bottom: 1px solid var(--card-border);
            flex-shrink: 0;
        }
        #map-modal-header span { font-size: 0.95rem; font-weight: 800; color: var(--accent); }
        #map-close-btn {
            border: none;
            background: var(--card-bg);
            border-radius: 10px;
            padding: 8px 14px;
            font-size: 0.82rem;
            font-weight: 700;
            color: var(--text-sub);
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }
        #map-full { width: 100%; flex: 1; }

        .controls {
            background: var(--white);
            padding: 14px 15px calc(env(safe-area-inset-bottom, 16px) + 16px);
            border-top-left-radius: 22px;
            border-top-right-radius: 22px;
            box-shadow: var(--shadow-ctrl);
            overflow: visible;
            flex-shrink: 0;
        }

        .sec { margin-bottom: 11px; }
        .sec label { display: block; font-size: 0.73rem; color: var(--text); font-weight: 700; margin-bottom: 6px; }

        .grid-5 { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
        .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }

        .sel-btn {
            padding: 9px 2px;
            border: 2px solid var(--btn-border);
            border-radius: 11px;
            background: var(--btn-bg);
            color: var(--btn-color);
            font-size: 0.78rem;
            font-weight: 700;
            cursor: pointer;
            text-align: center;
            line-height: 1.25;
            transition: border-color 0.14s, background 0.14s, color 0.14s;
            -webkit-tap-highlight-color: transparent;
        }
        .sel-btn .sub { display: block; font-size: 0.58rem; font-weight: 500; color: var(--text-muted); margin-top: 1px; }
        .sel-btn.active {
            border-color: var(--accent);
            background: var(--accent);
            color: #fff;
            box-shadow: 0 3px 10px rgba(74,144,226,0.32);
        }
        .sel-btn.active .sub { color: rgba(255,255,255,0.8); }

        .dash {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 6px;
            margin-bottom: 12px;
        }
        .card { background: var(--card-bg); padding: 8px 4px; border-radius: 11px; text-align: center; border: 1px solid var(--card-border); }
        .card span   { display: block; font-size: 0.58rem; color: var(--text-sub); margin-bottom: 2px; }
        .card strong { font-size: 0.85rem; color: var(--accent); font-weight: 800; }

        .btn-row { display: flex; gap: 8px; margin-bottom: 13px; }
        .gen-btn {
            flex: 1; padding: 14px 8px; border: none; border-radius: 13px;
            background: linear-gradient(135deg, #4A90E2, #357ABD);
            color: #fff; font-size: 0.88rem; font-weight: 800;
            box-shadow: 0 5px 16px rgba(74,144,226,0.33);
            cursor: pointer; transition: transform 0.18s, filter 0.18s;
            -webkit-tap-highlight-color: transparent; line-height: 1.3;
        }
        .gen-btn:active { transform: scale(0.97); filter: brightness(0.9); }
        .rnd-btn {
            flex: 1; padding: 14px 8px; border: none; border-radius: 13px;
            background: linear-gradient(135deg, #FF6B6B, #E74C3C);
            color: #fff; font-size: 0.88rem; font-weight: 800;
            box-shadow: 0 5px 16px rgba(255,107,107,0.33);
            cursor: pointer; transition: transform 0.18s, filter 0.18s;
            -webkit-tap-highlight-color: transparent; line-height: 1.3;
        }
        .rnd-btn:active { transform: scale(0.97); filter: brightness(0.9); }

        .route-section h2 { font-size: 0.84rem; color: var(--text); margin: 0 0 8px 2px; font-weight: 700; }
        .step-item {
            display: flex; align-items: center;
            margin-bottom: 6px; padding: 10px 12px;
            background: var(--step-bg); border-radius: 11px; border: 1px solid var(--step-border);
        }
        .step-circle {
            width: 26px; height: 26px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 0.65rem; font-weight: 800; color: #fff;
            margin-right: 10px; flex-shrink: 0;
        }
        .c-start { background: #5C6BC0; }
        .c-way   { background: var(--coral); }
        .c-home  { background: #2ECC71; }
        .step-text { font-size: 0.86rem; font-weight: 600; color: var(--text); flex: 1; }
        .step-badge {
            font-size: 0.6rem; border-radius: 5px; padding: 2px 6px;
            font-weight: 700; flex-shrink: 0;
            background: #1E2140; color: #8899DD;
        }
        .step-badge.coral { background: #FFF0F0; color: var(--coral); }
        .step-badge.green { background: #EAFAF1; color: #27AE60; }

        /* 날씨 바 */
        #weather-bar {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-top: 7px;
            padding: 5px 14px;
            background: var(--card-bg);
            border-radius: 20px;
            font-size: 0.78rem;
            font-weight: 600;
            color: var(--text);
            border: 1px solid var(--card-border);
        }
        #weather-advice {
            font-size: 0.68rem;
            padding: 2px 8px;
            border-radius: 10px;
            font-weight: 700;
            background: #E8F4FD;
            color: #4A90E2;
        }

        #overlay {
            display: none; position: absolute; inset: 0;
            background: rgba(15,17,23,0.88); z-index: 200;
            align-items: center; justify-content: center; flex-direction: column;
        }
        #overlay.show { display: flex; }
        .spinner {
            width: 36px; height: 36px;
            border: 4px solid var(--btn-border); border-top-color: var(--accent);
            border-radius: 50%; animation: spin 0.8s linear infinite; margin-bottom: 10px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        #overlay p { font-size: 0.82rem; color: var(--text-sub); font-weight: 600; }
    </style>
</head>
<body>

<header>
    <h1>🚩 홍장군 전용 산책 케어</h1>
    <p>힐스테이트 청계 정문 출발 · 귀가 고정</p>
    <div id="weather-bar">
        <span id="weather-icon">⏳</span>
        <span id="weather-text">날씨 불러오는 중...</span>
        <span id="weather-advice"></span>
    </div>
</header>

<div class="map-wrap">
    <div id="map"></div>
    <div id="overlay" class="show">
        <div class="spinner"></div>
        <p>지도 불러오는 중...</p>
    </div>
    <button id="map-expand-btn" onclick="openMapModal()">🗺️ 크게 보기</button>
</div>

<div id="map-modal">
    <div id="map-modal-header">
        <span>🚩 홍장군 산책 코스</span>
        <button id="map-close-btn" onclick="closeMapModal()">✕ 닫기</button>
    </div>
    <div id="map-full"></div>
</div>

<div class="controls">
    <div class="sec">
        <label>⏰ 산책 시간</label>
        <div class="grid-5">
            <button class="sel-btn time-btn" data-min="30"  onclick="selectTime(30)">30분<span class="sub" id="sub-30">-</span></button>
            <button class="sel-btn time-btn" data-min="45"  onclick="selectTime(45)">45분<span class="sub" id="sub-45">-</span></button>
            <button class="sel-btn time-btn active" data-min="60" onclick="selectTime(60)">60분<span class="sub" id="sub-60">-</span></button>
            <button class="sel-btn time-btn" data-min="75"  onclick="selectTime(75)">75분<span class="sub" id="sub-75">-</span></button>
            <button class="sel-btn time-btn" data-min="90"  onclick="selectTime(90)">90분<span class="sub" id="sub-90">-</span></button>
        </div>
    </div>

    <div class="sec">
        <label>👟 걸음 속도</label>
        <div class="grid-3">
            <button class="sel-btn speed-btn" data-speed="2.5" onclick="selectSpeed(2.5)">🐢 천천히<span class="sub">2.5km/h</span></button>
            <button class="sel-btn speed-btn active" data-speed="4.0" onclick="selectSpeed(4.0)">🚶 보통<span class="sub">4.0km/h</span></button>
            <button class="sel-btn speed-btn" data-speed="5.5" onclick="selectSpeed(5.5)">🏃 빠르게<span class="sub">5.5km/h</span></button>
        </div>
    </div>

    <div class="dash">
        <div class="card"><span>⏱️ 시간</span><strong id="dsh-time">60분</strong></div>
        <div class="card"><span>🎯 목표거리</span><strong id="dsh-target">-km</strong></div>
        <div class="card"><span>📏 실제거리</span><strong id="dsh-real">-km</strong></div>
        <div class="card"><span>⚡ 속도</span><strong id="dsh-speed">4.0</strong></div>
        <div class="card"><span>🔥 칼로리</span><strong id="dsh-cal">-kcal</strong></div>
    </div>

    <div class="btn-row">
        <button class="gen-btn" onclick="generateRandomCourse()">📍 오늘의<br>홍장군 코스</button>
        <button class="rnd-btn" onclick="generateFullRandom()">🎲 완전<br>랜덤 코스</button>
    </div>

    <div class="route-section">
        <h2>📋 상세 이동 가이드</h2>
        <div id="route-steps"></div>
    </div>
</div>

<script>
'use strict';

/* ── 상수 ── */
const START    = { lat: 37.57152873927553, lng: 127.04760981436473, name: '힐스테이트 청계' };
const TIMES    = [30, 45, 60, 75, 90];
const SPEEDS   = [2.5, 4.0, 5.5];
const WEIGHT   = 50;                          /* 보호자 체중 kg */
const MET      = { 2.5: 2.5, 4.0: 3.5, 5.5: 5.0 }; /* 속도 → MET */
const LAT_PER_KM = 0.009;
const LNG_PER_KM = 0.01125;                  /* 서울 위도 37.5° 기준 */
const DIRS     = ['북','북동','동','남동','남','남서','서','북서'];

/* ── 상태 ── */
let map, polyline, mapFull = null, polylineFull = null;
let overlays = [], overlaysFull = [], lastOverlayData = [], lastPath = [];
let selMin = 60, selSpd = 4.0, mapReady = false;

/* ── 유틸 ── */
function haversine(lat1, lng1, lat2, lng2) {
    const R = 6371;
    const dLat = (lat2 - lat1) * Math.PI / 180;
    const dLng = (lng2 - lng1) * Math.PI / 180;
    const a = Math.sin(dLat/2)**2
            + Math.cos(lat1*Math.PI/180) * Math.cos(lat2*Math.PI/180) * Math.sin(dLng/2)**2;
    return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
}

function calcCalorie(spd, min) {
    const met = MET[String(spd)] || MET[spd] || 3.5;  /* 문자열/숫자 키 모두 대응 */
    return Math.round(met * WEIGHT * (min / 60));
}

/* ── UI 공통 업데이트 ── */
function updateUI() {
    const targetKm = selSpd * selMin / 60;
    document.getElementById('dsh-time').innerText   = selMin + '분';
    document.getElementById('dsh-speed').innerText  = selSpd.toFixed(1);
    document.getElementById('dsh-target').innerText = targetKm.toFixed(1) + 'km';
    document.getElementById('dsh-cal').innerText    = calcCalorie(selSpd, selMin) + 'kcal';
    TIMES.forEach(m => {
        const el = document.getElementById('sub-' + m);
        if (el) el.innerText = '~' + (selSpd * m / 60).toFixed(1) + 'km';
    });
}

/* ── 선택 핸들러 ── */
function selectTime(min) {
    selMin = min;
    document.querySelectorAll('.time-btn').forEach(b => b.classList.toggle('active', +b.dataset.min === min));
    updateUI();
    generateRandomCourse();
}

function selectSpeed(spd) {
    selSpd = spd;
    document.querySelectorAll('.speed-btn').forEach(b => b.classList.toggle('active', +b.dataset.speed === spd));
    updateUI();
    generateRandomCourse();
}

/* ── 완전 랜덤 코스 ── */
function generateFullRandom() {
    let newMin, newSpd, tries = 0;
    do {
        newMin = TIMES[Math.floor(Math.random() * TIMES.length)];
        newSpd = SPEEDS[Math.floor(Math.random() * SPEEDS.length)];
        tries++;
    } while (newMin === selMin && newSpd === selSpd && tries < 10);

    selMin = newMin;
    selSpd = newSpd;
    document.querySelectorAll('.time-btn').forEach(b => b.classList.toggle('active', +b.dataset.min === newMin));
    document.querySelectorAll('.speed-btn').forEach(b => b.classList.toggle('active', +b.dataset.speed === newSpd));
    updateUI();
    generateRandomCourse();
}

/* ── 경유지 생성 (수학적 랜덤) ── */
function pickWaypoints(targetKm) {
    const maxWp     = targetKm < 2.5 ? 1 : 2;
    const idealDist = targetKm / (maxWp + 1);
    const chosen    = [];
    const usedAngles = [];

    for (let i = 0; i < maxWp; i++) {
        let angle, tries = 0;
        do {
            angle = Math.random() * 360;
            const ok = usedAngles.every(a => {
                const diff = Math.abs(angle - a) % 360;
                return Math.min(diff, 360 - diff) >= 60;
            });
            if (ok) break;
        } while (++tries < 30);
        usedAngles.push(angle);

        const r   = idealDist * (0.85 + Math.random() * 0.3);
        const rad = angle * Math.PI / 180;
        const lat = START.lat + Math.cos(rad) * r * LAT_PER_KM;
        const lng = START.lng + Math.sin(rad) * r * LNG_PER_KM;
        const dir = DIRS[Math.round(((angle % 360) + 360) % 360 / 45) % 8];
        chosen.push({ lat, lng, name: `${dir} 방향 ${r.toFixed(1)}km 지점`, tag: '산책' });
    }
    return chosen;
}

/* ── 지도 초기화 ── */
function initMap() {
    map = new kakao.maps.Map(document.getElementById('map'), {
        center: new kakao.maps.LatLng(START.lat, START.lng),
        level: 5
    });
    mapReady = true;
    document.getElementById('overlay').classList.remove('show');
    updateUI();
    generateRandomCourse();
    loadWeather();
}

/* ── 코스 생성 ── */
function generateRandomCourse() {
    if (!mapReady) return;

    /* 기존 요소 정리 */
    if (polyline) polyline.setMap(null);
    overlays.forEach(o => o.setMap(null));
    overlays        = [];
    lastOverlayData = [];
    document.getElementById('route-steps').innerHTML = '';

    const targetKm = selSpd * selMin / 60;
    const selected = pickWaypoints(targetKm);
    const startLL  = new kakao.maps.LatLng(START.lat, START.lng);
    const path     = [startLL];

    addOverlay(startLL, '출', '#5C6BC0');
    addStep('출', START.name + ' (출발)', 'c-start', '출발', '');

    selected.forEach((pt, i) => {
        const pos = new kakao.maps.LatLng(pt.lat, pt.lng);
        path.push(pos);
        addOverlay(pos, String(i + 1), '#FF6B6B');
        addStep(String(i + 1), pt.name, 'c-way', pt.tag, 'coral');
    });

    path.push(startLL);
    addOverlay(new kakao.maps.LatLng(START.lat - 0.0002, START.lng + 0.0002), '귀', '#2ECC71');
    addStep('귀', START.name + ' (귀가)', 'c-home', '도착', 'green');

    /* 실제 거리 계산 */
    const realKm = path.reduce((sum, p, i) => {
        if (i === 0) return sum;
        return sum + haversine(path[i-1].getLat(), path[i-1].getLng(), p.getLat(), p.getLng());
    }, 0);
    document.getElementById('dsh-real').innerText = realKm.toFixed(1) + 'km';
    document.getElementById('dsh-cal').innerText  = calcCalorie(selSpd, realKm / selSpd * 60) + 'kcal';

    /* 중심·줌 계산 */
    let minLat = Infinity, maxLat = -Infinity, minLng = Infinity, maxLng = -Infinity;
    path.forEach(p => {
        const la = p.getLat(), lo = p.getLng();
        if (la < minLat) minLat = la; if (la > maxLat) maxLat = la;
        if (lo < minLng) minLng = lo; if (lo > maxLng) maxLng = lo;
    });
    const span   = Math.max((maxLat - minLat) / LAT_PER_KM, (maxLng - minLng) / LNG_PER_KM);
    const level  = span < 0.8 ? 4 : span < 1.5 ? 5 : span < 3 ? 6 : span < 6 ? 7 : 8;
    const center = new kakao.maps.LatLng((minLat + maxLat) / 2, (minLng + maxLng) / 2);

    /* setLevel + setCenter 를 한 번에 처리 → iOS 이중 애니메이션 방지 */
    map.setLevel(level, { animate: false });
    map.setCenter(center);

    /* 폴리라인: 지도 정착 후 그리기
       idle = 지도 이동·줌 완전히 끝난 시점 (iOS 포함 가장 안정적)
       + setTimeout 이중 보험으로 idle 누락 케이스 대응 */
    lastPath = path;
    let drawn = false;

    function drawPolyline() {
        if (drawn) return;
        drawn = true;
        if (polyline) polyline.setMap(null);
        polyline = new kakao.maps.Polyline({
            path, strokeWeight: 7,
            strokeColor: '#4A90E2', strokeOpacity: 0.85, strokeStyle: 'solid'
        });
        polyline.setMap(map);
    }

    kakao.maps.event.addListener(map, 'idle', function onIdle() {
        kakao.maps.event.removeListener(map, 'idle', onIdle);
        drawPolyline();
    });

    /* idle 가 500ms 내 안 오면 강제 실행 */
    setTimeout(drawPolyline, 500);
}

/* ── 오버레이 추가 ── */
function addOverlay(pos, label, color) {
    const content = `<div style="background:${color};color:#fff;border-radius:50%;`
        + `width:30px;height:30px;display:flex;align-items:center;justify-content:center;`
        + `font-size:11px;font-weight:800;border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,0.22);">${label}</div>`;
    const o = new kakao.maps.CustomOverlay({ position: pos, content, yAnchor: 0.5 });
    o.setMap(map);
    overlays.push(o);
    lastOverlayData.push({ pos, content });
}

/* ── 경로 목록 ── */
function addStep(num, name, circleClass, badgeText, badgeStyle) {
    const list = document.getElementById('route-steps');
    const div  = document.createElement('div');
    div.className = 'step-item';
    const bc = badgeStyle ? `step-badge ${badgeStyle}` : 'step-badge';
    const bh = badgeText  ? `<span class="${bc}">${badgeText}</span>` : '';
    div.innerHTML = `<div class="step-circle ${circleClass}">${num}</div>`
        + `<div class="step-text">${name}</div>${bh}`;
    list.appendChild(div);
}

/* ── 지도 전체보기 모달 ── */
function openMapModal() {
    document.getElementById('map-modal').classList.add('show');
    document.body.style.overflow = 'hidden';
    if (!mapFull) {
        mapFull = new kakao.maps.Map(document.getElementById('map-full'), {
            center: new kakao.maps.LatLng(START.lat, START.lng),
            level: 5
        });
    }
    syncFullMap();
}

function closeMapModal() {
    document.getElementById('map-modal').classList.remove('show');
    document.body.style.overflow = '';
}

function syncFullMap() {
    if (!mapFull || !lastPath.length) return;
    if (polylineFull) polylineFull.setMap(null);
    overlaysFull.forEach(o => o.setMap(null));
    overlaysFull = [];

    polylineFull = new kakao.maps.Polyline({
        path: lastPath, strokeWeight: 8,
        strokeColor: '#4A90E2', strokeOpacity: 0.9, strokeStyle: 'solid'
    });
    polylineFull.setMap(mapFull);

    lastOverlayData.forEach(({ pos, content }) => {
        const o = new kakao.maps.CustomOverlay({ position: pos, content, yAnchor: 0.5 });
        o.setMap(mapFull);
        overlaysFull.push(o);
    });

    const bounds = new kakao.maps.LatLngBounds();
    lastPath.forEach(p => bounds.extend(p));
    mapFull.setBounds(bounds, 60, 60, 60, 60);
}

/* ── 날씨 연동 (Open-Meteo, 키 불필요) ── */
function loadWeather() {
    const url = `https://api.open-meteo.com/v1/forecast`
        + `?latitude=${START.lat}&longitude=${START.lng}`
        + `&current=temperature_2m,weather_code,windspeed_10m`  /* weather_code: 최신 API 필드명 */
        + `&timezone=Asia%2FSeoul`;

    function decodeWMO(code) {
        if (code === 0)   return { icon: '☀️',  text: '맑음' };
        if (code <= 2)    return { icon: '🌤️',  text: '구름 조금' };
        if (code === 3)   return { icon: '☁️',  text: '흐림' };
        if (code <= 49)   return { icon: '🌫️',  text: '안개' };
        if (code <= 59)   return { icon: '🌦️',  text: '이슬비' };
        if (code <= 69)   return { icon: '🌧️',  text: '비' };
        if (code <= 79)   return { icon: '❄️',  text: '눈' };
        if (code <= 84)   return { icon: '🌧️',  text: '소나기' };
        if (code <= 99)   return { icon: '⛈️',  text: '뇌우' };
        return { icon: '🌡️', text: '알 수 없음' };
    }

    function getAdvice(temp, code, wind) {
        const dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (code >= 80)   return { text: '산책 비추 🚫', color: dark ? '#3D1A1A' : '#FFE0E0', tcolor: '#E74C3C' };
        if (code >= 60)   return { text: '우산 필요 ☂️', color: dark ? '#2D2510' : '#FFF3CD', tcolor: '#E67E22' };
        if (temp >= 33)   return { text: '더위 주의 🥵', color: dark ? '#3D1A1A' : '#FFE0E0', tcolor: '#E74C3C' };
        if (temp <= 0)    return { text: '방한 필수 🧣', color: dark ? '#0D1E30' : '#E8F4FD', tcolor: '#5BA3F5' };
        if (temp <= 10)   return { text: '쌀쌀해요 🧥',  color: dark ? '#0D1E30' : '#E8F4FD', tcolor: '#5BA3F5' };
        if (wind >= 30)   return { text: '바람 강함 💨', color: dark ? '#2D2510' : '#FFF3CD', tcolor: '#E67E22' };
        return { text: '산책 최적 ✅', color: dark ? '#0D2418' : '#EAFAF1', tcolor: '#27AE60' };
    }

    fetch(url)
        .then(r => r.json())
        .then(data => {
            const cur  = data.current;
            const temp = Math.round(cur.temperature_2m);
            /* weather_code / weathercode 둘 다 대응 */
            const code = cur.weather_code ?? cur.weathercode ?? 0;
            const wind = Math.round(cur.windspeed_10m);
            const wmo  = decodeWMO(code);
            const adv  = getAdvice(temp, code, wind);

            document.getElementById('weather-icon').innerText = wmo.icon;
            document.getElementById('weather-text').innerText = `${wmo.text} ${temp}°C · 바람 ${wind}km/h`;

            const advEl = document.getElementById('weather-advice');
            advEl.innerText        = adv.text;
            advEl.style.background = adv.color;
            advEl.style.color      = adv.tcolor;

            const bar = document.getElementById('weather-bar');
            bar.style.background   = adv.color;
            bar.style.borderColor  = adv.tcolor + '44';
        })
        .catch(() => {
            document.getElementById('weather-text').innerText = '날씨 정보 없음';
            document.getElementById('weather-icon').innerText = '🌡️';
        });
}
