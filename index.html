<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>홍장군 전용 산책 케어</title>
    <style>
        :root {
            --accent: #4A90E2;
            --coral: #FF6B6B;
            --bg: #F8F9FD;
            --white: #FFFFFF;
        }
        * { box-sizing: border-box; }
        html, body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
            margin: 0;
            background: var(--bg);
            color: #333;
            /* 아이폰 크롬 스크롤 정상화 */
            height: 100%;
            overflow-x: hidden;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }
        body {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            min-height: -webkit-fill-available;
        }
        header {
            background: var(--white);
            padding: env(safe-area-inset-top, 12px) 20px 13px;
            text-align: center;
            box-shadow: 0 2px 12px rgba(0,0,0,0.06);
            z-index: 100;
            flex-shrink: 0;
            position: sticky;
            top: 0;
        }
        header h1 { margin: 0; font-size: 1.25rem; color: var(--accent); font-weight: 900; letter-spacing: -0.5px; }
        header p  { margin: 3px 0 0; font-size: 0.73rem; color: #888; }

        /* 지도 컨테이너 */
        .map-wrap {
            position: relative;
            width: 100%;
            height: 45vw;
            min-height: 200px;
            max-height: 320px;
            flex-shrink: 0;
        }
        #map { width: 100%; height: 100%; }

        /* 지도 전체보기 버튼 */
        #map-expand-btn {
            position: absolute;
            top: 10px; right: 10px;
            z-index: 120;
            background: var(--white);
            border: none;
            border-radius: 10px;
            padding: 7px 10px;
            font-size: 0.75rem;
            font-weight: 700;
            color: #444;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
            cursor: pointer;
            display: flex; align-items: center; gap: 4px;
            -webkit-tap-highlight-color: transparent;
        }
        #map-expand-btn:active { filter: brightness(0.9); }

        /* 지도 전체보기 모달 */
        #map-modal {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 999;
            background: #000;
            flex-direction: column;
        }
        #map-modal.show { display: flex; }
        #map-modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: env(safe-area-inset-top, 12px) 16px 10px;
            background: var(--white);
            flex-shrink: 0;
        }
        #map-modal-header span {
            font-size: 0.95rem;
            font-weight: 800;
            color: var(--accent);
        }
        #map-close-btn {
            border: none;
            background: #F0F5FB;
            border-radius: 10px;
            padding: 8px 14px;
            font-size: 0.82rem;
            font-weight: 700;
            color: #555;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }
        #map-full { width: 100%; flex: 1; }

        .controls {
            background: var(--white);
            padding: 14px 15px calc(env(safe-area-inset-bottom, 16px) + 16px);
            border-top-left-radius: 22px;
            border-top-right-radius: 22px;
            box-shadow: 0 -8px 28px rgba(0,0,0,0.09);
            /* 스크롤 제거 - body가 스크롤 담당 */
            overflow: visible;
            flex-shrink: 0;
        }

        .sec { margin-bottom: 11px; }
        .sec label {
            display: block;
            font-size: 0.73rem;
            color: #555;
            font-weight: 700;
            margin-bottom: 6px;
        }

        /* 시간 버튼: 5개 */
        .grid-5 { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
        /* 속도 버튼: 3개 */
        .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }

        .sel-btn {
            padding: 9px 2px;
            border: 2px solid #E1E8F0;
            border-radius: 11px;
            background: #F5F7FA;
            color: #666;
            font-size: 0.78rem;
            font-weight: 700;
            cursor: pointer;
            text-align: center;
            line-height: 1.25;
            transition: all 0.14s;
            -webkit-tap-highlight-color: transparent;
        }
        .sel-btn .sub {
            display: block;
            font-size: 0.58rem;
            font-weight: 500;
            color: #aaa;
            margin-top: 1px;
        }
        .sel-btn.active {
            border-color: var(--accent);
            background: var(--accent);
            color: #fff;
            box-shadow: 0 3px 10px rgba(74,144,226,0.32);
        }
        .sel-btn.active .sub { color: rgba(255,255,255,0.8); }

        /* 대시보드 */
        .dash {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
            margin-bottom: 12px;
        }
        .card {
            background: #F0F5FB;
            padding: 8px 4px;
            border-radius: 11px;
            text-align: center;
            border: 1px solid #E1EAF4;
        }
        .card span   { display: block; font-size: 0.58rem; color: #777; margin-bottom: 2px; }
        .card strong { font-size: 0.85rem; color: var(--accent); font-weight: 800; }

        .btn-row {
            display: flex;
            gap: 8px;
            margin-bottom: 13px;
        }
        .gen-btn {
            flex: 1;
            padding: 14px 8px;
            border: none;
            border-radius: 13px;
            background: linear-gradient(135deg, #4A90E2, #357ABD);
            color: #fff;
            font-size: 0.88rem;
            font-weight: 800;
            box-shadow: 0 5px 16px rgba(74,144,226,0.33);
            cursor: pointer;
            transition: all 0.18s;
            -webkit-tap-highlight-color: transparent;
            line-height: 1.3;
        }
        .gen-btn:active { transform: scale(0.97); filter: brightness(0.9); }
        .rnd-btn {
            flex: 1;
            padding: 14px 8px;
            border: none;
            border-radius: 13px;
            background: linear-gradient(135deg, #FF6B6B, #E74C3C);
            color: #fff;
            font-size: 0.88rem;
            font-weight: 800;
            box-shadow: 0 5px 16px rgba(255,107,107,0.33);
            cursor: pointer;
            transition: all 0.18s;
            -webkit-tap-highlight-color: transparent;
            line-height: 1.3;
        }
        .rnd-btn:active { transform: scale(0.97); filter: brightness(0.9); }

        .route-section h2 { font-size: 0.84rem; color: #444; margin: 0 0 8px 2px; font-weight: 700; }

        .step-item {
            display: flex;
            align-items: center;
            margin-bottom: 6px;
            padding: 10px 12px;
            background: #fff;
            border-radius: 11px;
            border: 1px solid #EFEFEF;
        }
        .step-circle {
            width: 26px; height: 26px;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 0.65rem; font-weight: 800; color: #fff;
            margin-right: 10px; flex-shrink: 0;
        }
        .c-start { background: #5C6BC0; }
        .c-way   { background: var(--coral); }
        .c-home  { background: #2ECC71; }

        .step-text { font-size: 0.86rem; font-weight: 600; color: #333; flex: 1; }
        .step-badge {
            font-size: 0.6rem; border-radius: 5px;
            padding: 2px 6px; font-weight: 700; flex-shrink: 0;
            background: #EEF2FF; color: #5C6BC0;
        }
        .step-badge.coral { background: #FFF0F0; color: var(--coral); }
        .step-badge.green { background: #EAFAF1; color: #27AE60; }

        #overlay {
            display: none; position: absolute;
            inset: 0; background: rgba(248,249,253,0.88);
            z-index: 200; align-items: center; justify-content: center; flex-direction: column;
        }
        #overlay.show { display: flex; }
        .spinner {
            width: 36px; height: 36px;
            border: 4px solid #E1E8F0; border-top-color: var(--accent);
            border-radius: 50%; animation: spin 0.8s linear infinite; margin-bottom: 10px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        #overlay p { font-size: 0.82rem; color: #666; font-weight: 600; }
    </style>
</head>
<body>

<header>
    <h1>🚩 홍장군 전용 산책 케어</h1>
    <p>힐스테이트 청계 정문 출발 · 귀가 고정</p>
    <div id="weather-bar" style="
        display:inline-flex; align-items:center; gap:8px;
        margin-top:7px; padding:5px 14px;
        background:#F0F5FB; border-radius:20px;
        font-size:0.78rem; font-weight:600; color:#444;
        border:1px solid #E1EAF4;
    ">
        <span id="weather-icon">⏳</span>
        <span id="weather-text">날씨 불러오는 중...</span>
        <span id="weather-advice" style="
            font-size:0.68rem; padding:2px 8px;
            border-radius:10px; font-weight:700;
            background:#E8F4FD; color:#4A90E2;
        "></span>
    </div>
</header>

<div class="map-wrap">
    <div id="map"></div>
    <div id="overlay" class="show">
        <div class="spinner"></div>
        <p>지도 불러오는 중...</p>
    </div>
    <button id="map-expand-btn" onclick="openMapModal()">🗺️ 크게 보기</button>
</div>

<!-- 지도 전체보기 모달 -->
<div id="map-modal">
    <div id="map-modal-header">
        <span>🚩 홍장군 산책 코스</span>
        <button id="map-close-btn" onclick="closeMapModal()">✕ 닫기</button>
    </div>
    <div id="map-full"></div>
</div>

<div class="controls">

    <!-- 산책 시간 -->
    <div class="sec">
        <label>⏰ 산책 시간</label>
        <div class="grid-5">
            <button class="sel-btn time-btn" data-min="30"  onclick="selectTime(30)">30분<span class="sub" id="sub-30">-</span></button>
            <button class="sel-btn time-btn" data-min="45"  onclick="selectTime(45)">45분<span class="sub" id="sub-45">-</span></button>
            <button class="sel-btn time-btn active" data-min="60"  onclick="selectTime(60)">60분<span class="sub" id="sub-60">-</span></button>
            <button class="sel-btn time-btn" data-min="75"  onclick="selectTime(75)">75분<span class="sub" id="sub-75">-</span></button>
            <button class="sel-btn time-btn" data-min="90"  onclick="selectTime(90)">90분<span class="sub" id="sub-90">-</span></button>
        </div>
    </div>

    <!-- 👟 걸음 속도 -->
    <div class="sec">
        <label>👟 걸음 속도</label>
        <div class="grid-3">
            <button class="sel-btn speed-btn" data-speed="2.5" onclick="selectSpeed(2.5)">🐢 천천히<span class="sub">2.5km/h</span></button>
            <button class="sel-btn speed-btn active" data-speed="4.0" onclick="selectSpeed(4.0)">🚶 보통<span class="sub">4.0km/h</span></button>
            <button class="sel-btn speed-btn" data-speed="5.5" onclick="selectSpeed(5.5)">🏃 빠르게<span class="sub">5.5km/h</span></button>
        </div>
    </div>

    <!-- 대시보드 -->
    <div class="dash" style="grid-template-columns:repeat(5,1fr);">
        <div class="card"><span>⏱️ 시간</span><strong id="dsh-time">60분</strong></div>
        <div class="card"><span>🎯 목표거리</span><strong id="dsh-target">-km</strong></div>
        <div class="card"><span>📏 실제거리</span><strong id="dsh-real">-km</strong></div>
        <div class="card"><span>⚡ 속도</span><strong id="dsh-speed">4.0</strong></div>
        <div class="card"><span>🔥 칼로리</span><strong id="dsh-cal">-kcal</strong></div>
    </div>

    <div class="btn-row">
        <button class="gen-btn" onclick="generateRandomCourse()">📍 오늘의<br>홍장군 코스</button>
        <button class="rnd-btn" onclick="generateFullRandom()">🎲 완전<br>랜덤 코스</button>
    </div>

    <div class="route-section">
        <h2>📋 상세 이동 가이드</h2>
        <div id="route-steps"></div>
    </div>

</div>

<script>
/* ── 출발지 ── */
const START = { lat: 37.57152873927553, lng: 127.04760981436473, name: "힐스테이트 청계" };

/* 경유지 풀 없음 - 목표거리 기반 수학적 랜덤 좌표 생성 */

let map, polyline, overlays = [];
let selMin = 60, selSpd = 4.0, mapReady = false;

/* ── 선택 핸들러 ── */
function selectTime(min) {
    selMin = min;
    document.querySelectorAll('.time-btn').forEach(b => b.classList.toggle('active', +b.dataset.min === min));
    document.getElementById('dsh-time').innerText = min + '분';
    refresh();
}
function selectSpeed(spd) {
    selSpd = spd;
    document.querySelectorAll('.speed-btn').forEach(b => b.classList.toggle('active', +b.dataset.speed === spd));
    document.getElementById('dsh-speed').innerText = spd.toFixed(1);
    refresh();
}

/* 시간·속도 변경 시 대시보드와 버튼 서브텍스트 갱신 */
var WEIGHT = 50; /* 홍장군 보호자 체중 (kg) */
var MET_TABLE = { 2.5: 2.5, 4.0: 3.5, 5.5: 5.0 }; /* 속도별 MET 값 */

function calcCalorie(spd, min) {
    var met = MET_TABLE[spd] || 3.5;
    return Math.round(met * WEIGHT * (min / 60));
}

function refresh() {
    var targetKm = selSpd * selMin / 60;
    document.getElementById('dsh-target').innerText = targetKm.toFixed(1) + 'km';
    [30,45,60,75,90].forEach(function(m) {
        var el = document.getElementById('sub-' + m);
        if (el) el.innerText = '~' + (selSpd * m / 60).toFixed(1) + 'km';
    });
    /* 칼로리 업데이트 */
    document.getElementById('dsh-cal').innerText = calcCalorie(selSpd, selMin) + 'kcal';
    generateRandomCourse(); /* 버튼 누를 때마다 무조건 코스 재생성 */
}

/* ── 완전 랜덤 코스 생성 ── */
function generateFullRandom() {
    var times  = [30, 45, 60, 75, 90];
    var speeds = [2.5, 4.0, 5.5];

    /* 현재 선택값과 다른 값이 나오도록 반복 */
    var newMin, newSpd, tries = 0;
    do {
        newMin = times[Math.floor(Math.random() * times.length)];
        newSpd = speeds[Math.floor(Math.random() * speeds.length)];
        tries++;
    } while (newMin === selMin && newSpd === selSpd && tries < 10);

    /* 시간 버튼 UI 업데이트 */
    selMin = newMin;
    document.querySelectorAll('.time-btn').forEach(function(b) {
        b.classList.toggle('active', +b.dataset.min === newMin);
    });
    document.getElementById('dsh-time').innerText = newMin + '분';

    /* 속도 버튼 UI 업데이트 */
    selSpd = newSpd;
    document.querySelectorAll('.speed-btn').forEach(function(b) {
        b.classList.toggle('active', +b.dataset.speed === newSpd);
    });
    document.getElementById('dsh-speed').innerText = newSpd.toFixed(1);

    /* 칼로리·거리 라벨 갱신 후 코스 생성 */
    var targetKm = newSpd * newMin / 60;
    document.getElementById('dsh-target').innerText = targetKm.toFixed(1) + 'km';
    document.getElementById('dsh-cal').innerText = calcCalorie(newSpd, newMin) + 'kcal';
    [30,45,60,75,90].forEach(function(m) {
        var el = document.getElementById('sub-' + m);
        if (el) el.innerText = '~' + (newSpd * m / 60).toFixed(1) + 'km';
    });

    generateRandomCourse();
}

/* ── 목표 거리에 맞는 경유지 선택 ──
   목표거리 = speed × time
   경유지를 하나씩 추가할 때마다 "출발→경유지→...→출발" 총 직선 거리 합산.
   총합이 목표거리를 넘지 않는 범위에서 최대한 채움.
*/
function pickWaypoints(targetKm) {
    /* 경유지 풀 없이 수학적으로 랜덤 좌표 생성
       - 경유지 수: targetKm < 2.5 → 1개, 이상 → 2개
       - 각 경유지는 출발지로부터 idealDist 반경에 랜덤 방향각으로 배치
       - 방향각은 이전 경유지와 최소 60° 이상 차이나도록 강제 (겹침 방지)
       - 1km당 위도 ≈ 0.009°, 경도 ≈ 0.01125° (서울 기준) */
    var maxWp = targetKm < 2.5 ? 1 : 2;
    var idealDist = targetKm / (maxWp + 1);

    var LAT_PER_KM = 0.009;       /* 위도 1km */
    var LNG_PER_KM = 0.01125;     /* 경도 1km (서울 위도 37.5° 기준) */

    var chosen = [];
    var usedAngles = [];

    for (var i = 0; i < maxWp; i++) {
        var angle, tries = 0;
        /* 이전 경유지 방향과 60° 이상 차이나는 각도 선택 */
        do {
            angle = Math.random() * 360;
            var ok = usedAngles.every(function(a) {
                var diff = Math.abs(angle - a) % 360;
                return Math.min(diff, 360 - diff) >= 60;
            });
            tries++;
        } while (!ok && tries < 30);
        usedAngles.push(angle);

        /* 이상거리에서 ±15% 랜덤 변동 추가 */
        var r = idealDist * (0.85 + Math.random() * 0.3);
        var rad = angle * Math.PI / 180;

        var lat = START.lat + Math.cos(rad) * r * LAT_PER_KM;
        var lng = START.lng + Math.sin(rad) * r * LNG_PER_KM;

        /* 방향각 → 방위 이름 */
        var dirs = ["북","북동","동","남동","남","남서","서","북서"];
        var dirName = dirs[Math.round(((angle % 360) + 360) % 360 / 45) % 8];
        var distStr = r.toFixed(1);
        chosen.push({ lat: lat, lng: lng, name: dirName + " 방향 " + distStr + "km 지점", tag: "산책" });
    }
    return chosen;
}

/* Haversine 거리 (km) */
function haversine(lat1, lng1, lat2, lng2) {
    var R = 6371;
    var dLat = (lat2 - lat1) * Math.PI / 180;
    var dLng = (lng2 - lng1) * Math.PI / 180;
    var a = Math.sin(dLat/2)*Math.sin(dLat/2)
          + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)
          * Math.sin(dLng/2)*Math.sin(dLng/2);
    return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

/* ── 지도 초기화 ── */
function initMap() {
    map = new kakao.maps.Map(document.getElementById('map'), {
        center: new kakao.maps.LatLng(START.lat, START.lng),
        level: 5
    });
    mapReady = true;
    document.getElementById('overlay').classList.remove('show');
    refresh();
    loadWeather();
}

/* ── 코스 생성 ── */
function generateRandomCourse() {
    if (!mapReady) return;

    if (polyline) polyline.setMap(null);
    overlays.forEach(function(o) { o.setMap(null); });
    overlays = [];
    lastOverlayData = []; /* 모달 오버레이 초기화 */
    document.getElementById('route-steps').innerHTML = '';

    var targetKm = selSpd * selMin / 60;
    var selected = pickWaypoints(targetKm);

    var startLL = new kakao.maps.LatLng(START.lat, START.lng);
    var path = [startLL];

    addOverlay(startLL, '출', '#5C6BC0');
    addStep('출', START.name + ' (출발)', 'c-start', '출발', '');

    selected.forEach(function(pt, i) {
        var pos = new kakao.maps.LatLng(pt.lat, pt.lng);
        path.push(pos);
        addOverlay(pos, String(i+1), '#FF6B6B');
        addStep(String(i+1), pt.name, 'c-way', pt.tag, 'coral');
    });

    path.push(startLL);
    addOverlay(new kakao.maps.LatLng(START.lat - 0.0002, START.lng + 0.0002), '귀', '#2ECC71');
    addStep('귀', START.name + ' (귀가)', 'c-home', '도착', 'green');

    var realKm = 0;
    path.forEach(function(p, i) {
        if (i > 0) {
            var prev = path[i-1];
            realKm += haversine(prev.getLat(), prev.getLng(), p.getLat(), p.getLng());
        }
    });
    document.getElementById('dsh-real').innerText = realKm.toFixed(1) + 'km';

    /* 실제 거리 기반 칼로리 재계산 (MET × 체중 × 실제시간) */
    var realMin = realKm / selSpd * 60;
    document.getElementById('dsh-cal').innerText = calcCalorie(selSpd, realMin) + 'kcal';

    var bounds = new kakao.maps.LatLngBounds();
    path.forEach(function(p) { bounds.extend(p); });

    /* 폴리라인 먼저 즉시 그리기 */
    lastPath = path; /* 모달 동기화용 저장 */
    polyline = new kakao.maps.Polyline({
        path: path, strokeWeight: 7,
        strokeColor: '#4A90E2', strokeOpacity: 0.85, strokeStyle: 'solid'
    });
    polyline.setMap(map);

    /* 중심점·줌 계산 후 지도 이동 (setBounds 대신 직접 설정) */
    var minLat = Infinity, maxLat = -Infinity, minLng = Infinity, maxLng = -Infinity;
    path.forEach(function(p) {
        var la = p.getLat(), lo = p.getLng();
        if (la < minLat) minLat = la; if (la > maxLat) maxLat = la;
        if (lo < minLng) minLng = lo; if (lo > maxLng) maxLng = lo;
    });
    var centerLat = (minLat + maxLat) / 2;
    var centerLng = (minLng + maxLng) / 2;
    var spanLat = maxLat - minLat;
    var spanLng = maxLng - minLng;
    var span = Math.max(spanLat / 0.009, spanLng / 0.01125); /* km 단위 */
    var level = span < 0.8 ? 4 : span < 1.5 ? 5 : span < 3 ? 6 : span < 6 ? 7 : 8;
    map.setLevel(level);
    map.setCenter(new kakao.maps.LatLng(centerLat, centerLng));

    /* 폴리라인 재확인: 지도 이동 후에도 유지되도록 추가 보장 */
    setTimeout(function() {
        if (polyline) polyline.setMap(map);
    }, 300);
}

function addOverlay(pos, label, color) {
    var content = '<div style="background:' + color + ';color:#fff;border-radius:50%;'
        + 'width:30px;height:30px;display:flex;align-items:center;justify-content:center;'
        + 'font-size:11px;font-weight:800;border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,0.22);">'
        + label + '</div>';
    var o = new kakao.maps.CustomOverlay({ position: pos, content: content, yAnchor: 0.5 });
    o.setMap(map);
    overlays.push(o);
    lastOverlayData.push({ pos: pos, content: content }); /* 모달 동기화용 */
}

function addStep(num, name, circleClass, badgeText, badgeStyle) {
    var list = document.getElementById('route-steps');
    var div  = document.createElement('div');
    div.className = 'step-item';
    var bc = badgeStyle ? 'step-badge ' + badgeStyle : 'step-badge';
    var bh = badgeText ? '<span class="' + bc + '">' + badgeText + '</span>' : '';
    div.innerHTML = '<div class="step-circle ' + circleClass + '">' + num + '</div>'
        + '<div class="step-text">' + name + '</div>' + bh;
    list.appendChild(div);
}

/* ── 지도 전체보기 모달 ── */
var mapFull = null;
var polylineFull = null;
var overlaysFull = [];
var lastPath = [];   /* 마지막으로 생성된 경로 저장 */

function openMapModal() {
    document.getElementById('map-modal').classList.add('show');
    document.body.style.overflow = 'hidden';

    if (!mapFull) {
        mapFull = new kakao.maps.Map(document.getElementById('map-full'), {
            center: new kakao.maps.LatLng(START.lat, START.lng),
            level: 5
        });
    }
    syncFullMap();
}

function closeMapModal() {
    document.getElementById('map-modal').classList.remove('show');
    document.body.style.overflow = '';
}

function syncFullMap() {
    if (!mapFull || lastPath.length === 0) return;

    /* 기존 요소 제거 */
    if (polylineFull) polylineFull.setMap(null);
    overlaysFull.forEach(function(o) { o.setMap(null); });
    overlaysFull = [];

    /* 폴리라인 복사 */
    polylineFull = new kakao.maps.Polyline({
        path: lastPath, strokeWeight: 8,
        strokeColor: '#4A90E2', strokeOpacity: 0.9, strokeStyle: 'solid'
    });
    polylineFull.setMap(mapFull);

    /* 오버레이 복사 */
    lastOverlayData.forEach(function(od) {
        var o = new kakao.maps.CustomOverlay({
            position: od.pos, content: od.content, yAnchor: 0.5
        });
        o.setMap(mapFull);
        overlaysFull.push(o);
    });

    /* 범위 맞추기 */
    var bounds = new kakao.maps.LatLngBounds();
    lastPath.forEach(function(p) { bounds.extend(p); });
    mapFull.setBounds(bounds, 60, 60, 60, 60);
}

var lastOverlayData = []; /* 오버레이 데이터 저장 */

/* ── 날씨 연동 (Open-Meteo, 키 불필요) ── */
function loadWeather() {
    var lat = START.lat, lng = START.lng;

    /* WMO 날씨 코드 → 이모지 + 설명 */
    function decodeWMO(code) {
        if (code === 0)            return { icon: '☀️',  text: '맑음' };
        if (code <= 2)             return { icon: '🌤️',  text: '구름 조금' };
        if (code === 3)            return { icon: '☁️',  text: '흐림' };
        if (code <= 49)            return { icon: '🌫️',  text: '안개' };
        if (code <= 59)            return { icon: '🌦️',  text: '이슬비' };
        if (code <= 69)            return { icon: '🌧️',  text: '비' };
        if (code <= 79)            return { icon: '❄️',  text: '눈' };
        if (code <= 84)            return { icon: '🌧️',  text: '소나기' };
        if (code <= 99)            return { icon: '⛈️',  text: '뇌우' };
        return { icon: '🌡️', text: '알 수 없음' };
    }

    /* 산책 적합도 판단 */
    function getAdvice(temp, code, windspeed) {
        if (code >= 80)  return { text: '산책 비추 🚫', color: '#FFE0E0', tcolor: '#E74C3C' };
        if (code >= 60)  return { text: '우산 필요 ☂️', color: '#FFF3CD', tcolor: '#E67E22' };
        if (temp >= 33)  return { text: '더위 주의 🥵', color: '#FFE0E0', tcolor: '#E74C3C' };
        if (temp <= 0)   return { text: '방한 필수 🧣', color: '#E8F4FD', tcolor: '#2980B9' };
        if (temp <= 10)  return { text: '쌀쌀해요 🧥', color: '#E8F4FD', tcolor: '#2980B9' };
        if (windspeed >= 30) return { text: '바람 강함 💨', color: '#FFF3CD', tcolor: '#E67E22' };
        return { text: '산책 최적 ✅', color: '#EAFAF1', tcolor: '#27AE60' };
    }

    var url = 'https://api.open-meteo.com/v1/forecast'
        + '?latitude=' + lat
        + '&longitude=' + lng
        + '&current=temperature_2m,weathercode,windspeed_10m'
        + '&timezone=Asia%2FSeoul';

    fetch(url)
        .then(function(r) { return r.json(); })
        .then(function(data) {
            var cur   = data.current;
            var temp  = Math.round(cur.temperature_2m);
            var code  = cur.weathercode;
            var wind  = Math.round(cur.windspeed_10m);
            var wmo   = decodeWMO(code);
            var adv   = getAdvice(temp, code, wind);

            document.getElementById('weather-icon').innerText = wmo.icon;
            document.getElementById('weather-text').innerText =
                wmo.text + ' ' + temp + '°C · 바람 ' + wind + 'km/h';

            var advEl = document.getElementById('weather-advice');
            advEl.innerText = adv.text;
            advEl.style.background = adv.color;
            advEl.style.color = adv.tcolor;

            /* 날씨 바 배경도 적합도에 맞게 */
            document.getElementById('weather-bar').style.background = adv.color;
            document.getElementById('weather-bar').style.borderColor = adv.tcolor + '44';
        })
        .catch(function() {
            document.getElementById('weather-text').innerText = '날씨 정보 없음';
            document.getElementById('weather-icon').innerText = '🌡️';
        });
}
